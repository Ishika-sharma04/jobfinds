name: Daily job collection
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Legacy compatibility for existing repository secrets
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_INPUT_USD_PER_MILLION: ${{ vars.GEMINI_INPUT_USD_PER_MILLION }}
          GEMINI_OUTPUT_USD_PER_MILLION: ${{ vars.GEMINI_OUTPUT_USD_PER_MILLION }}
          GREENHOUSE_BOARDS: ${{ vars.GREENHOUSE_BOARDS }}
          LEVER_BOARDS: ${{ vars.LEVER_BOARDS }}
          ASHBY_BOARDS: ${{ vars.ASHBY_BOARDS }}
          ATS_STARTER_BOARDS: ${{ vars.ATS_STARTER_BOARDS }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
